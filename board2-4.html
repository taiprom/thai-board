  const m=E("div","meta");m.append(av(p.uid,nm(p),22),nameEl(p),E("span",null,ago(p.ts)),E("span",null,"💬 "+(p.nc||0)),E("span",null,(p.img?"📷 ":"")+(p.media?"🎵":"")));
  c.append(m);c.onclick=()=>open(p);box.append(c)})}
function open(p){if(unC){unC();unC=null}cur=p.id;ensure([p.uid]).then(c=>{if(c&&cur===p.id)open(p)});$("plist").hidden=true;$("fab").hidden=true;const d=$("detail");d.hidden=false;d.textContent="";
 const back=E("button","g","← กลับ");back.onclick=()=>{cur=null;if(unC){unC();unC=null}d.hidden=true;$("plist").hidden=false;$("fab").hidden=false;list()};d.append(back);
 const c=E("div","card");const m=E("div","meta");m.append(av(p.uid,nm(p),30),nameEl(p),E("span",null,ago(p.ts)));
 c.append(m,E("h2",null,mask(p.title)),rich("body",p.body));
 if(p.img){const im=E("img","pic");im.src=p.img;c.append(im)}
 const me=mediaEl(p.media);if(me)c.append(me);
 if(canDel(p)){const x=E("button","g","ลบกระทู้");x.style.marginTop="10px";x.onclick=()=>{if(confirm("ลบกระทู้นี้?")){P.doc(p.id).delete();back.click()}};c.append(x)}
 d.append(c);
 const cc=E("div","card");cc.append(E("b",null,"ความคิดเห็น"));const box=E("div");cc.append(box);
 const ta=E("textarea");ta.rows=3;ta.maxLength=1500;ta.placeholder="แสดงความคิดเห็น…";const sb=E("button",null,"ส่ง");
 sb.onclick=async()=>{const t=ta.value.trim();if(!t)return;if(bad(t)){alert("ข้อความมีคำไม่สุภาพ");return}const sp=spam("cm",t);if(sp){alert(sp);return}
  try{await C.add({pid:p.id,uid,name,body:t,ts:Date.now()});await P.doc(p.id).update({nc:FV.increment(1)});sent("cm",t);ta.value=""}catch(e){alert("ส่งไม่ได้: "+e.message)}};
 cc.append(ta,emoBtn(()=>ta),sb);d.append(cc);
 const cmCb=s=>{ensure(s.docs.map(x=>x.data().uid)).then(c=>{if(c&&cur===p.id)cmCb(s)});const rows=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.ts-b.ts);box.textContent="";
  if(!rows.length)box.append(E("div","empty","ยังไม่มีความคิดเห็น"));
  rows.forEach((r,i)=>{const w=E("div","cm");const mm=E("div","meta");mm.append(av(r.uid,nm(r),22),nameEl(r,"#"+(i+1)+" "),E("span",null,ago(r.ts)));
   if(canDel(r)){const x=E("a",null,"ลบ");x.style.cursor="pointer";x.onclick=()=>C.doc(r.id).delete();mm.append(x)}
   w.append(mm,rich("body",r.body));box.append(w)})};
 unC=C.where("pid","==",p.id).onSnapshot(cmCb);
 scrollTo(0,0)}
$("fab").onclick=()=>$("modal").classList.add("show");
$("no").onclick=()=>$("modal").classList.remove("show");
$("ok").onclick=async()=>{const title=$("nt").value.trim(),body=$("nb").value.trim(),mu=$("nm2").value.trim();
 if(!title||!body){alert("กรอกหัวข้อและเนื้อหา");return}
 if(bad(title+body)){alert("มีคำไม่สุภาพ กรุณาแก้ไข");return}
 if(mu&&!/^https?:\/\//.test(mu)){alert("ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://");return}
 const sp=spam("post",title+body);if(sp){alert(sp);return}
 $("ok").disabled=true;
 try{let img="";const f=$("ni").files[0];if(f){img=await shrink(f,800,.6);if(img.length>280000)img=await shrink(f,560,.5)}
  await P.add({uid,name,title,body,img,media:mu,ts:Date.now(),nc:0});sent("post",title+body);
  $("nt").value=$("nb").value=$("nm2").value=$("ni").value="";$("modal").classList.remove("show")}
 catch(e){alert("โพสต์ไม่สำเร็จ: "+e.message)}finally{$("ok").disabled=false}};
function start(){if(started||!uid||!name)return;started=true;U.doc(uid).get().then(d=>{if(!d.exists)U.doc(uid).set({uid,name,bio:"",photo:"",joined:Date.now()})}).catch(()=>{});
 P.orderBy("ts","desc").limit(50).onSnapshot(s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));if(cur===null)list()},e=>alert("โหลดกระทู้ไม่ได้: "+e.message));
 const chatCb=s=>{ensure(s.docs.map(d=>d.data().uid)).then(c=>{if(c)chatCb(s)});const box=$("cbox"),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.textContent="";
  const rows=s.docs.map(d=>({id:d.id,...d.data()})).reverse();
  if(!rows.length)box.append(E("div","empty","ยังไม่มีใครพูด ทักเลย 👋"));
  rows.forEach(r=>{const m=E("div","m"+(r.uid===uid?" me":""));const nn=E("div","n");nn.append(av(r.uid,nm(r),20),nameEl(r));m.append(nn,rich("b",r.body));
   if(canDel(r)){m.lastChild.style.cursor="pointer";m.lastChild.title="กดค้างเพื่อลบ";m.lastChild.oncontextmenu=e=>{e.preventDefault();if(confirm("ลบข้อความนี้?"))CH.doc(r.id).delete()}}
   box.append(m)});
  if(near||rows.length<=20)box.scrollTop=box.scrollHeight};
 CH.orderBy("ts","desc").limit(100).onSnapshot(chatCb,e=>alert("โหลดแชทไม่ได้: "+e.message))}
$("cf").onsubmit=async e=>{e.preventDefault();const t=$("ct").value.trim();if(!t||!uid||!name)return;
 if(bad(t)){alert("ข้อความมีคำไม่สุภาพ กรุณาแก้ไข");return}const sp=spam("chat",t);if(sp){alert(sp);return}
 $("ct").value="";try{await CH.add({uid,name,body:t,ts:Date.now()});sent("chat",t)}catch(err){alert("ส่งไม่ได้: "+err.message)}};
</script></body></html>
