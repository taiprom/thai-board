<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไทยบอร์ด</title>
<style>
:root{--out:#fff #404040 #404040 #fff;--in:#808080 #fff #fff #808080}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#008080;color:#000;font:15px/1.5 Tahoma,"Noto Sans Thai","Sarabun",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:5px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c0c0c0;letter-spacing:.5px}
header small{font-weight:400;cursor:pointer;text-decoration:underline;color:#ffff66}
.mq{background:#000;color:#00ff00;font:700 13px "Courier New",monospace;overflow:hidden;white-space:nowrap;border-bottom:2px solid #c0c0c0;padding:2px 0}
.mq span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
nav{display:flex;gap:4px;padding:10px 10px 0;max-width:780px;width:100%;margin:auto}
.tab{flex:1}
.tab.on{border-color:var(--in);background:#e8e8e8;font-weight:700}
main{flex:1;overflow-y:auto;padding:10px;max-width:780px;width:100%;margin:auto}
#chat{display:flex;flex-direction:column;overflow:hidden}
#cbox{flex:1;overflow-y:auto;background:#fff;border:2px solid;border-color:var(--in);padding:8px}
button{font:inherit;background:#c0c0c0;color:#000;border:2px solid;border-color:var(--out);border-radius:0;padding:5px 14px;cursor:pointer}
button:active{border-color:var(--in)}button:disabled{color:#808080}
button.g{background:#c0c0c0}
input,textarea{font:inherit;width:100%;padding:5px 7px;border:2px solid;border-color:var(--in);border-radius:0;background:#fff;color:#000;margin:3px 0}
.card{background:#c0c0c0;border:2px solid;border-color:var(--out);padding:10px;margin:10px 0}
.t{cursor:pointer}.t:hover{background:#d4d0c8}.t h3{margin:0 0 3px;font-size:1rem;color:#000080;text-decoration:underline}
h2{color:#000080;margin:6px 0}
.meta{font-size:.78rem;color:#404040;display:flex;gap:10px;flex-wrap:wrap}
.body{white-space:pre-wrap;word-break:break-word;background:#fff;border:2px solid;border-color:var(--in);padding:6px;margin-top:6px}
.cm{border-top:1px dashed #808080;padding:6px 0}
a{color:#0000ee}
.m{max-width:85%;margin:5px 0;display:flex;flex-direction:column}.m .n{font-size:.75rem;color:#000080;font-weight:700}
.m .b{background:#fff;border:1px solid #808080;padding:4px 8px;word-break:break-word;white-space:pre-wrap}
.m.me{margin-left:auto;align-items:flex-end}.m.me .b{background:#ffffcc}
#cf{display:flex;gap:6px;padding-top:8px}#cf input{margin:0}
.empty{text-align:center;color:#fff;margin:40px 0}.card .empty,#cbox .empty{color:#404040}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:9px 18px;z-index:5;font-weight:700}
#modal,#login{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
#modal.show,#login.show{display:flex}
.sheet{background:#c0c0c0;width:100%;max-width:780px;margin:auto;border:2px solid;border-color:var(--out);padding:16px;max-height:92%;overflow:auto}
.sheet::before{content:"ไทยบอร์ด";display:block;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;margin:-16px -16px 12px;padding:3px 8px;font-weight:700}
#login{background:#008080;align-items:center}#login .sheet{max-width:340px;text-align:center}
img.pic{max-width:100%;border:2px solid;border-color:var(--in);margin-top:10px}video,audio,iframe{max-width:100%;border:2px solid;border-color:var(--in);margin-top:10px;width:100%}
</style></head><body>
<header><span>🇹🇭 ไทยบอร์ด</span><small id="chg"></small></header>
<div class="mq"><span>★ ยินดีต้อนรับสู่ไทยบอร์ด ★ คุยได้ทุกเรื่อง ★ ห้ามพิมพ์คำหยาบนะจ๊ะ ★ Best viewed in 800x600 with Internet Explorer 6 ★</span></div>
<nav><button class="tab on" data-t="topics">📋 กระทู้</button><button class="tab" data-t="chat">💬 แชทโลก</button></nav>
<main id="topics"><div id="plist"></div><div id="detail" hidden></div></main>
<main id="chat" hidden><div id="cbox"></div><form id="cf"><input id="ct" maxlength="300" placeholder="พิมพ์ข้อความ…" autocomplete="off"><button>ส่ง</button></form></main>
<button id="fab">✏️ ตั้งกระทู้</button>
<div id="modal"><div class="sheet"><h3 style="margin:0">ตั้งกระทู้ใหม่</h3>
<input id="nt" maxlength="120" placeholder="หัวข้อ"><textarea id="nb" rows="5" maxlength="3000" placeholder="เนื้อหา"></textarea>
<div class="meta">📷 รูปภาพ (ถ้ามี)</div><input id="ni" type="file" accept="image/*">
<div class="meta">🎵🎬 ลิงก์เพลง/วิดีโอ: YouTube, Spotify หรือไฟล์ .mp3 .mp4 (ถ้ามี)</div><input id="nm2" maxlength="300" placeholder="https://...">
<div style="display:flex;gap:8px;margin-top:8px"><button id="ok">โพสต์</button><button class="g" id="no">ยกเลิก</button></div></div></div>
<div id="login" class="show"><div class="sheet"><div style="font-size:3rem">💾</div><h3 style="margin:4px 0">ใส่ชื่อก่อนเข้าห้อง</h3>
<input id="nm" maxlength="20" placeholder="ชื่อที่อยากใช้" style="text-align:center"><button id="go">เข้าห้อง</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== ใส่ค่าจากโปรเจกต์ Firebase ใหม่ =====
const CFG={apiKey:"AIzaSyASkoy7LH5JjkKTNS4uvjlvfIptxJXisME",authDomain:"thai-board.firebaseapp.com",projectId:"thai-board",appId:"1:789782154512:web:946534f1925b8968a5e995"};
const ADMINS=[]; // uid แอดมิน
const BAD=["ควย","เหี้ย","สัส","เย็ดแม่","เยดแม่","ส้นตีน","ไอ้สัตว์","อีสัตว์","ระยำ","ตอแหล","แม่ง","fuck","shit","bitch","cunt"];
const bad=t=>{const n=String(t).toLowerCase().replace(/[\s._\-*]+/g,"");return BAD.some(w=>n.includes(w))};
const mask=t=>{let r=String(t||"");BAD.forEach(w=>{r=r.split(w).join("***")});return r};
const $=i=>document.getElementById(i);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?"เมื่อครู่":m<60?Math.floor(m)+" นาทีที่แล้ว":m<1440?Math.floor(m/60)+" ชม.ที่แล้ว":Math.floor(m/1440)+" วันที่แล้ว"};
if(CFG.apiKey.startsWith("YOUR")){document.body.innerHTML='<p style="padding:20px">ยังไม่ได้ใส่ค่า CFG ในไฟล์ (ดูส่วนบนของสคริปต์)</p>';throw new Error("no config")}
// ---- กันสแปม ----
const last={chat:0,cm:0,post:0},gap={chat:3000,cm:8000,post:60000},hist=[];let lastText="";
function spam(k,t){const now=Date.now();
 if(now-last[k]<gap[k])return"ส่งเร็วเกินไป รออีก "+Math.ceil((gap[k]-(now-last[k]))/1000)+" วินาที";
 if(t===lastText)return"ข้อความซ้ำกับที่เพิ่งส่ง";
 if(/(.)\1{9,}/.test(t))return"มีตัวอักษรซ้ำมากเกินไป";
 if((t.match(/https?:\/\//g)||[]).length>2)return"ใส่ลิงก์ได้ไม่เกิน 2 ลิงก์";
 if(k==="chat"&&hist.filter(x=>now-x<60000).length>=12)return"ส่งถี่เกินไป ลองใหม่ใน 1 นาที";
 return""}
const sent=(k,t)=>{last[k]=Date.now();lastText=t;if(k==="chat")hist.push(Date.now())};
// ---- รูป / สื่อ ----
const shrink=(f,max,q)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)});
function mediaEl(u){if(!/^https?:\/\//.test(u||""))return null;let m;
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/)){const f=E("iframe");f.src="https://www.youtube-nocookie.com/embed/"+m[1];f.height=220;f.allowFullscreen=true;f.setAttribute("sandbox","allow-scripts allow-same-origin allow-presentation");return f}
 if(m=u.match(/open\.spotify\.com\/(track|album|playlist|episode)\/(\w+)/)){const f=E("iframe");f.src="https://open.spotify.com/embed/"+m[1]+"/"+m[2];f.height=152;f.setAttribute("sandbox","allow-scripts allow-same-origin");return f}
 if(/\.(mp3|ogg|wav|m4a)(\?|$)/i.test(u)){const a=E("audio");a.controls=true;a.src=u;return a}
 if(/\.(mp4|webm|mov)(\?|$)/i.test(u)){const v=E("video");v.controls=true;v.playsInline=true;v.src=u;return v}
 const a=E("a",null,"🔗 "+u.slice(0,60));a.href=u;a.target="_blank";a.rel="noopener noreferrer";return a}
// ---- Firebase ----
let name="",uid=null,started=false,cur=null,unC=null,posts=[],tab="topics";
try{name=localStorage.getItem("zname")||""}catch(e){}
firebase.initializeApp(CFG);
const fa=firebase.auth(),fs=firebase.firestore(),FV=firebase.firestore.FieldValue;
const P=fs.collection("posts"),C=fs.collection("comments"),CH=fs.collection("chat");
const canDel=x=>x.uid===uid||ADMINS.includes(uid);
fa.onAuthStateChanged(u=>{if(u){uid=u.uid;start()}else fa.signInAnonymously().catch(e=>alert("เข้าไม่ได้: "+e.message))});
function setName(n){name=n;try{localStorage.setItem("zname",n)}catch(e){}$("login").classList.remove("show");$("chg").textContent=name+" ✎";start()}
$("go").onclick=()=>{const n=$("nm").value.trim();if(!n){alert("ใส่ชื่อก่อน");return}if(bad(n)){alert("ชื่อมีคำไม่สุภาพ");return}setName(n)};
$("nm").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("chg").onclick=()=>{$("login").classList.add("show");$("nm").value=name};
if(name){$("login").classList.remove("show");$("chg").textContent=name+" ✎"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
 $("topics").hidden=tab!=="topics";$("chat").hidden=tab!=="chat";$("fab").hidden=tab!=="topics"||cur!==null;
 if(tab==="chat"){const c=$("cbox");c.scrollTop=c.scrollHeight}});
function list(){const box=$("plist");box.textContent="";
 if(!posts.length){box.append(E("div","empty","ยังไม่มีกระทู้ มาตั้งกระทู้แรกกัน"))}
 posts.forEach(p=>{const c=E("div","card t");c.append(E("h3",null,mask(p.title)));
  const m=E("div","meta");m.append(E("span",null,mask(p.name||"สมาชิก")),E("span",null,ago(p.ts)),E("span",null,"💬 "+(p.nc||0)),E("span",null,(p.img?"📷 ":"")+(p.media?"🎵":"")));
  c.append(m);c.onclick=()=>open(p);box.append(c)})}
function open(p){cur=p.id;$("plist").hidden=true;$("fab").hidden=true;const d=$("detail");d.hidden=false;d.textContent="";
 const back=E("button","g","← กลับ");back.onclick=()=>{cur=null;if(unC){unC();unC=null}d.hidden=true;$("plist").hidden=false;$("fab").hidden=false;list()};d.append(back);
 const c=E("div","card");const m=E("div","meta");m.append(E("b",null,mask(p.name||"สมาชิก")),E("span",null,ago(p.ts)));
 c.append(m,E("h2",null,mask(p.title)),E("div","body",mask(p.body)));
 if(p.img){const im=E("img","pic");im.src=p.img;c.append(im)}
 const me=mediaEl(p.media);if(me)c.append(me);
 if(canDel(p)){const x=E("button","g","ลบกระทู้");x.style.marginTop="10px";x.onclick=()=>{if(confirm("ลบกระทู้นี้?")){P.doc(p.id).delete();back.click()}};c.append(x)}
 d.append(c);
 const cc=E("div","card");cc.append(E("b",null,"ความคิดเห็น"));const box=E("div");cc.append(box);
 const ta=E("textarea");ta.rows=3;ta.maxLength=1500;ta.placeholder="แสดงความคิดเห็น…";const sb=E("button",null,"ส่ง");
 sb.onclick=async()=>{const t=ta.value.trim();if(!t)return;if(bad(t)){alert("ข้อความมีคำไม่สุภาพ");return}const sp=spam("cm",t);if(sp){alert(sp);return}
  try{await C.add({pid:p.id,uid,name,body:t,ts:Date.now()});await P.doc(p.id).update({nc:FV.increment(1)});sent("cm",t);ta.value=""}catch(e){alert("ส่งไม่ได้: "+e.message)}};
 cc.append(ta,sb);d.append(cc);
 unC=C.where("pid","==",p.id).onSnapshot(s=>{const rows=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.ts-b.ts);box.textContent="";
  if(!rows.length)box.append(E("div","empty","ยังไม่มีความคิดเห็น"));
  rows.forEach((r,i)=>{const w=E("div","cm");const mm=E("div","meta");mm.append(E("b",null,"#"+(i+1)+" "+mask(r.name||"สมาชิก")),E("span",null,ago(r.ts)));
   if(canDel(r)){const x=E("a",null,"ลบ");x.style.cursor="pointer";x.onclick=()=>C.doc(r.id).delete();mm.append(x)}
   w.append(mm,E("div","body",mask(r.body)));box.append(w)})});
 scrollTo(0,0)}
$("fab").onclick=()=>$("modal").classList.add("show");
$("no").onclick=()=>$("modal").classList.remove("show");
$("ok").onclick=async()=>{const title=$("nt").value.trim(),body=$("nb").value.trim(),mu=$("nm2").value.trim();
 if(!title||!body){alert("กรอกหัวข้อและเนื้อหา");return}
 if(bad(title+body)){alert("มีคำไม่สุภาพ กรุณาแก้ไข");return}
 if(mu&&!/^https?:\/\//.test(mu)){alert("ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://");return}
 const sp=spam("post",title+body);if(sp){alert(sp);return}
 $("ok").disabled=true;
 try{let img="";const f=$("ni").files[0];if(f){img=await shrink(f,800,.6);if(img.length>280000)img=await shrink(f,560,.5)}
  await P.add({uid,name,title,body,img,media:mu,ts:Date.now(),nc:0});sent("post",title+body);
  $("nt").value=$("nb").value=$("nm2").value=$("ni").value="";$("modal").classList.remove("show")}
 catch(e){alert("โพสต์ไม่สำเร็จ: "+e.message)}finally{$("ok").disabled=false}};
function start(){if(started||!uid||!name)return;started=true;
 P.orderBy("ts","desc").limit(50).onSnapshot(s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));if(cur===null)list()},e=>alert("โหลดกระทู้ไม่ได้: "+e.message));
 CH.orderBy("ts","desc").limit(100).onSnapshot(s=>{const box=$("cbox"),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.textContent="";
  const rows=s.docs.map(d=>({id:d.id,...d.data()})).reverse();
  if(!rows.length)box.append(E("div","empty","ยังไม่มีใครพูด ทักเลย 👋"));
  rows.forEach(r=>{const m=E("div","m"+(r.uid===uid?" me":""));m.append(E("div","n",mask(r.name||"ไม่ระบุชื่อ")),E("div","b",mask(r.body)));
   if(canDel(r)){m.lastChild.style.cursor="pointer";m.lastChild.title="กดค้างเพื่อลบ";m.lastChild.oncontextmenu=e=>{e.preventDefault();if(confirm("ลบข้อความนี้?"))CH.doc(r.id).delete()}}
   box.append(m)});
  if(near||rows.length<=20)box.scrollTop=box.scrollHeight},e=>alert("โหลดแชทไม่ได้: "+e.message))}
$("cf").onsubmit=async e=>{e.preventDefault();const t=$("ct").value.trim();if(!t||!uid||!name)return;
 if(bad(t)){alert("ข้อความมีคำไม่สุภาพ กรุณาแก้ไข");return}const sp=spam("chat",t);if(sp){alert(sp);return}
 $("ct").value="";try{await CH.add({uid,name,body:t,ts:Date.now()});sent("chat",t)}catch(err){alert("ส่งไม่ได้: "+err.message)}};
</script></body></html>
